[build-system]
requires = [
  "cmake",
  "nanobind",
  "ninja",
  "numpy>2.0.0",
  "pybind11>=2.12.0",
  "setuptools<=83, >=62",
  "wheel"
]
build-backend = "setuptools.build_meta"

[tool.bandit]
skips = ["B607"]

[tool.black]
line-length = 100
extend-exclude = '''
(
  frontend/catalyst/python_bindings
  | mlir/llvm-project
  | mlir/Enzyme
  | mlir/stablehlo
  | build
  | env
  | demos
  | mlir/standalone
)
'''

[tool.coverage.run]
branch = true
source = [
  "./frontend/catalyst/",
]
omit = [
  "*/python_bindings/*",
  "./frontend/catalyst/_version.py",
  "./frontend/catalyst/_revision.py",
  "*/standalone/*",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.report]
sort = "Cover"

[tool.isort]
py_version = 312
profile = "black"
line_length = 100
skip = [
  "catalyst/mlir/llvm-project",
  "frontend/catalyst/test/test_oqc/conftest.py",
  "frontend/catalyst/third_party",
  "frontend/test/conftest.py",
  "catalyst/mlir/standalone",
]
extend_skip_glob = [
  "mlir/llvm-project/*",
  "mlir/Enzyme/*",
  "mlir/stablehlo/*",
  "mlir/build/*",
  "runtime/build/*",
  ".git/*",
  ".vscode/*",
  "*venv*/*",
  "_deps/*",
  "mlir/standalone/*",
]
known_first_party = ["catalyst"]
known_third_party = ["diastatic-malt", "jax", "jaxlib", "numpy", "pennylane"]

[tool.pytest.ini_options]
cache_dir = "/tmp/.pytest_cache"
testpaths = ["frontend/test/pytest", "frontend/test/test_oqc/oqc"]
