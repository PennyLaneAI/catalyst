name: Transport path filter
description: >
  Report whether this push or pull request touched anything the transport build and its tests
  are derived from, so jobs can gate on `transport == 'true'` instead of running unconditionally.
  Requires a checkout with fetch-depth: 0, since it diffs against the base ref.

outputs:
  transport:
    description: "true when a tracked transport path changed between the base ref and HEAD"
    value: ${{ steps.filter.outputs.transport }}

runs:
  using: composite
  steps:
    - id: filter
      shell: bash
      env:
        # PRs diff against the merge base, pushes against the previous head. Either can be
        # unreachable (shallow clone, first push to a branch), so HEAD^ is the fallback.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD^"

        # Git pathspecs, so one list drives both the staleness check and the diff.
        PATTERNS=(
          'runtime/lib/transport/*'
          'runtime/lib/executor/*'
          'runtime/lib/backend/*'
          'runtime/include/Transport*'
          'runtime/tests/Test_Transport*'
          'runtime/Makefile'
          'mlir/lib/Transport/*'
          'mlir/include/Transport/*'
          'frontend/catalyst/backline.py'
          'frontend/test/pytest/test_backline.py'
          'frontend/test/pytest/conftest.py'
          '.github/actions/setup-soft-roce/*'
          '.github/actions/transport-path-filter/*'
          '.github/workflows/check-catalyst.yaml'
        )

        # A pattern matching nothing reports transport=false forever, and a skipped job reads as
        # a passing one. Fail loudly so a rename has to update this list.
        for pattern in "${PATTERNS[@]}"; do
          git ls-files --error-unmatch -- "$pattern" >/dev/null 2>&1 && continue
          echo "::error::transport path filter matches no tracked file: $pattern" >&2
          echo "Update or remove it in .github/actions/transport-path-filter." >&2
          exit 1
        done

        transport=false
        [ -z "$(git diff --name-only "$BASE" HEAD -- "${PATTERNS[@]}")" ] || transport=true
        echo "transport=$transport" >> "$GITHUB_OUTPUT"
