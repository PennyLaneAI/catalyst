name: Transport path filter
description: >
  Report whether this change touched anything the transport build or its tests derive from,
  so jobs can gate on `transport == 'true'`. Needs fetch-depth: 0 to diff against the base ref.

outputs:
  transport:
    description: "true when a tracked transport path changed between the base ref and HEAD"
    value: ${{ steps.filter.outputs.transport }}

runs:
  using: composite
  steps:
    - id: filter
      shell: bash
      env:
        # PRs diff against the merge base, pushes against the previous head. Either can be
        # unreachable (shallow clone, first push to a branch), so HEAD^ is the fallback.
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="HEAD^"

        # Git pathspecs for the diff below.
        PATTERNS=(
          'runtime/lib/transport/*'
          'runtime/lib/executor/*'
          'runtime/lib/backend/*'
          'runtime/include/Transport*'
          'runtime/tests/Test_Transport*'
          'runtime/Makefile'
          'mlir/lib/Transport/*'
          'mlir/include/Transport/*'
          'frontend/catalyst/backline.py'
          'frontend/test/pytest/test_backline.py'
          'frontend/test/pytest/conftest.py'
          '.github/actions/setup-soft-roce/*'
          '.github/actions/transport-path-filter/*'
          '.github/workflows/check-catalyst.yaml'
        )

        transport=false
        # Empty diff output means no pathspec matched, so the gate stays closed.
        [ -z "$(git diff --name-only "$BASE" HEAD -- "${PATTERNS[@]}")" ] || transport=true
        echo "transport=$transport" >> "$GITHUB_OUTPUT"
