name: Build the MLIR stack on this runner
description: >
  Build LLVM, StableHLO and Enzyme into llvm-build/, stablehlo-build/ and enzyme-build/. For
  self-hosted runners, which cannot reuse check-catalyst.yaml's caches: those come from GH-hosted
  images and the cached mlir-tblgen hits a GLIBC mismatch here. Expects the LLVM source at
  mlir/llvm-project already.

  Two ways to avoid rebuilding, picked by `persist-root`:

  * unset -- the GitHub cache. Restore and save are separate steps rather than the combined
    `actions/cache`, which only saves in a post-job step: the caller spends another hour on
    Triton and GPU tests after this action returns, and anything that ends the job in there --
    a failure, a timeout, a cancel -- would otherwise discard a finished multi-hour LLVM build.
  * set -- a directory on the runner itself, which is what a dedicated self-hosted box wants.
    Nothing is uploaded or downloaded, and the result is not scoped to a PR ref, so it is still
    there for the next run on any branch.

inputs:
  llvm-version:
    description: LLVM ref, used in the build cache key
    required: true
  stablehlo-version:
    description: StableHLO ref, cloned and keyed on
    required: true
  enzyme-version:
    description: Enzyme ref, cloned and keyed on
    required: true
  cache-prefix:
    description: Cache key prefix; keep distinct from the GH-hosted keys so the two never collide
    required: false
    default: selfhosted-gpu
  llvm-variant:
    description: >
      Names this LLVM configuration. Variants configured with different cmake options get their
      own cache entry, or their own on-disk slot, instead of overwriting each other. `default` is
      a plain `make llvm`; its cache key is spelled exactly as before so existing caches keep
      hitting.
    required: false
    default: default
  llvm-build-options:
    description: >
      `make llvm` variable overrides defining a non-default variant, space separated, e.g.
      "LLVM_TARGETS_TO_BUILD=host;AArch64". Ignored for the default variant. Whatever is set
      here has to be reflected in `llvm-variant`, which is what the slot is named after -- the
      options themselves are not part of the key.
    required: false
    default: ""
  persist-root:
    description: >
      Directory on the runner to build into, outside the workspace so `actions/checkout`'s
      `git clean -ffdx` cannot delete it. A leading `~` is expanded. Set this on a dedicated
      self-hosted runner to reuse the built stack directly; leave it empty on ephemeral runners,
      where the GitHub cache is the only thing that survives.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang lld
        python3 -m pip install numpy "nanobind<2.13" pybind11 PyYAML

    - name: Prepare the persistent build directories
      id: persist
      if: inputs.persist-root != ''
      shell: bash
      env:
        PERSIST_ROOT: ${{ inputs.persist-root }}
        SLOT: llvm-${{ inputs.llvm-version }}-${{ inputs.llvm-variant }}-${{ inputs.stablehlo-version }}-${{ inputs.enzyme-version }}-gcc
      run: |
        set -euo pipefail
        # One slot per set of refs, so bumping any of them starts from an empty tree rather than
        # reconfiguring an incompatible one. Old slots are left behind deliberately -- reclaiming
        # that disk is a judgement call for whoever owns the runner, not something to do silently
        # from a workflow.
        base="${PERSIST_ROOT/#\~/$HOME}/$SLOT"
        # The stamp alone is not enough to trust a tree: a build that reported success while
        # writing somewhere else stamped a directory that is actually empty, and every later run
        # then skipped the build and failed seconds later in the next component. Require the
        # artifact the next component consumes, and drop a stamp that is not backed by one.
        for d in llvm-build stablehlo-build enzyme-build; do
          case "$d" in
            llvm-build) marker=lib/cmake/mlir/MLIRConfig.cmake ;;
            *)          marker=CMakeCache.txt ;;
          esac
          mkdir -p "$base/$d"
          # Symlinked into the workspace so every `$(pwd)/<d>` in the caller keeps resolving.
          ln -sfn "$base/$d" "$GITHUB_WORKSPACE/$d"
          if [ -e "$base/$d/.catalyst-complete" ] && [ -e "$base/$d/$marker" ]; then
            echo "${d%%-*}_ready=true" >> "$GITHUB_OUTPUT"
            echo "reusing $d from $base"
          else
            rm -f "$base/$d/.catalyst-complete"
          fi
        done
        echo "PERSIST_BASE=$base" >> "$GITHUB_ENV"
        du -sh "$base" 2>/dev/null || true

    - name: Restore LLVM build
      id: cache-llvm-build
      if: inputs.persist-root == ''
      uses: actions/cache/restore@v4
      with:
        path: llvm-build
        # The variant is appended only when it is not `default`, so the default key stays
        # byte-identical to the one already in the cache -- adding a variant must not cost
        # everyone else a fresh LLVM build.
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-llvm-${{ inputs.llvm-version }}-ci-build-gcc${{ inputs.llvm-variant != 'default' && format('-{0}', inputs.llvm-variant) || '' }}

    - name: Build LLVM
      if: steps.cache-llvm-build.outputs.cache-hit != 'true' && steps.persist.outputs.llvm_ready != 'true'
      shell: bash
      env:
        LLVM_BUILD_OPTIONS: ${{ inputs.llvm-build-options }}
      run: |
        # Jobs from different PRs share this runner and this slot -- three were seen
        # building at once. Serialize on the slot, then re-check the stamp, so a job
        # that waited here reuses the finished tree instead of clobbering it.
        if [ -n "${PERSIST_BASE:-}" ]; then
          exec 9>"$PERSIST_BASE/llvm-build.lock"
          flock 9
          if [ -e "$PERSIST_BASE/llvm-build/.catalyst-complete" ] \
             && [ -e "$PERSIST_BASE/llvm-build/lib/cmake/mlir/MLIRConfig.cmake" ]; then
            echo "llvm-build was completed by a concurrent job; reusing it"
            exit 0
          fi
        fi
        # $LLVM_BUILD_OPTIONS is unquoted on purpose: the overrides are several words, and
        # as make command-line variables they propagate into the `-C mlir` sub-make and beat
        # its `?=` defaults. It must stay above the assignments -- a comment between a `\`
        # continuation and `make` silently detaches every assignment from the command.
        C_COMPILER=$(which gcc) \
        CXX_COMPILER=$(which g++) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        COMPILER_LAUNCHER="" \
        make llvm $LLVM_BUILD_OPTIONS
        # Verify the tree actually landed in llvm-build. `make` exits 0 after building
        # into its own default directory if the env prefix above ever stops reaching it --
        # which already happened once, and only surfaced two hours later as a confusing
        # find_package failure in the next component.
        if [ ! -e "$(pwd)/llvm-build/lib/cmake/mlir/MLIRConfig.cmake" ]; then
          echo "::error::llvm-build/lib/cmake/mlir/MLIRConfig.cmake is missing after 'make llvm' reported success."
          exit 1
        fi
        if [ -n "${PERSIST_BASE:-}" ]; then
          touch "$PERSIST_BASE/llvm-build/.catalyst-complete"
        fi

    - name: Save llvm-build
      if: inputs.persist-root == '' && steps.cache-llvm-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: llvm-build
        key: ${{ steps.cache-llvm-build.outputs.cache-primary-key }}

    - name: Cache StableHLO source
      id: cache-stablehlo-source
      uses: actions/cache@v4
      with:
        path: mlir/stablehlo
        key: stablehlo-${{ inputs.stablehlo-version }}-default-source
        enableCrossOsArchive: true

    - name: Clone StableHLO
      if: steps.cache-stablehlo-source.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: openxla/stablehlo
        ref: ${{ inputs.stablehlo-version }}
        path: mlir/stablehlo

    - name: Restore StableHLO build
      id: cache-stablehlo-build
      if: inputs.persist-root == ''
      uses: actions/cache/restore@v4
      with:
        path: stablehlo-build
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-stablehlo-${{ inputs.stablehlo-version }}-ci-build-gcc

    - name: Build StableHLO
      if: steps.cache-stablehlo-build.outputs.cache-hit != 'true' && steps.persist.outputs.stablehlo_ready != 'true'
      shell: bash
      run: |
        # Jobs from different PRs share this runner and this slot -- three were seen
        # building at once. Serialize on the slot, then re-check the stamp, so a job
        # that waited here reuses the finished tree instead of clobbering it.
        if [ -n "${PERSIST_BASE:-}" ]; then
          exec 9>"$PERSIST_BASE/stablehlo-build.lock"
          flock 9
          if [ -e "$PERSIST_BASE/stablehlo-build/.catalyst-complete" ] \
             && [ -e "$PERSIST_BASE/stablehlo-build/CMakeCache.txt" ]; then
            echo "stablehlo-build was completed by a concurrent job; reusing it"
            exit 0
          fi
        fi
        C_COMPILER=$(which gcc) \
        CXX_COMPILER=$(which g++) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
        COMPILER_LAUNCHER="" \
        make stablehlo
        # Verify the tree actually landed in stablehlo-build. `make` exits 0 after building
        # into its own default directory if the env prefix above ever stops reaching it --
        # which already happened once, and only surfaced two hours later as a confusing
        # find_package failure in the next component.
        if [ ! -e "$(pwd)/stablehlo-build/CMakeCache.txt" ]; then
          echo "::error::stablehlo-build/CMakeCache.txt is missing after 'make stablehlo' reported success."
          exit 1
        fi
        if [ -n "${PERSIST_BASE:-}" ]; then
          touch "$PERSIST_BASE/stablehlo-build/.catalyst-complete"
        fi

    - name: Save stablehlo-build
      if: inputs.persist-root == '' && steps.cache-stablehlo-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: stablehlo-build
        key: ${{ steps.cache-stablehlo-build.outputs.cache-primary-key }}

    - name: Cache Enzyme source
      id: cache-enzyme-source
      uses: actions/cache@v4
      with:
        path: mlir/Enzyme
        key: enzyme-${{ inputs.enzyme-version }}-default-source
        enableCrossOsArchive: true

    - name: Clone Enzyme
      if: steps.cache-enzyme-source.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: EnzymeAD/Enzyme
        ref: ${{ inputs.enzyme-version }}
        path: mlir/Enzyme

    - name: Restore Enzyme build
      id: cache-enzyme-build
      if: inputs.persist-root == ''
      uses: actions/cache/restore@v4
      with:
        path: enzyme-build
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-enzyme-${{ inputs.llvm-version }}-${{ inputs.enzyme-version }}-ci-build-gcc

    - name: Build Enzyme
      if: steps.cache-enzyme-build.outputs.cache-hit != 'true' && steps.persist.outputs.enzyme_ready != 'true'
      shell: bash
      run: |
        # Jobs from different PRs share this runner and this slot -- three were seen
        # building at once. Serialize on the slot, then re-check the stamp, so a job
        # that waited here reuses the finished tree instead of clobbering it.
        if [ -n "${PERSIST_BASE:-}" ]; then
          exec 9>"$PERSIST_BASE/enzyme-build.lock"
          flock 9
          if [ -e "$PERSIST_BASE/enzyme-build/.catalyst-complete" ] \
             && [ -e "$PERSIST_BASE/enzyme-build/CMakeCache.txt" ]; then
            echo "enzyme-build was completed by a concurrent job; reusing it"
            exit 0
          fi
        fi
        C_COMPILER=$(which gcc) \
        CXX_COMPILER=$(which g++) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
        COMPILER_LAUNCHER="" \
        make enzyme
        # Verify the tree actually landed in enzyme-build. `make` exits 0 after building
        # into its own default directory if the env prefix above ever stops reaching it --
        # which already happened once, and only surfaced two hours later as a confusing
        # find_package failure in the next component.
        if [ ! -e "$(pwd)/enzyme-build/CMakeCache.txt" ]; then
          echo "::error::enzyme-build/CMakeCache.txt is missing after 'make enzyme' reported success."
          exit 1
        fi
        if [ -n "${PERSIST_BASE:-}" ]; then
          touch "$PERSIST_BASE/enzyme-build/.catalyst-complete"
        fi

    - name: Save enzyme-build
      if: inputs.persist-root == '' && steps.cache-enzyme-build.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: enzyme-build
        key: ${{ steps.cache-enzyme-build.outputs.cache-primary-key }}
