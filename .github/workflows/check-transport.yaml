name: Check Transport Backends

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'runtime/lib/transport/**'
      - 'runtime/tests/Test_Transport*.cpp'
      - 'runtime/tests/stubs/stub_transport_backend*'
      - 'runtime/tests/CMakeLists.txt'
      - 'runtime/CMakeLists.txt'
      - 'runtime/lib/CMakeLists.txt'
      - 'runtime/Makefile'
      - 'Makefile'
      - '.github/workflows/check-transport.yaml'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constants:
    name: "Set build matrix"
    uses: ./.github/workflows/constants.yaml
    with:
      multiple_compilers: false
      runs_on: ubuntu-22.04

  transport-tests:
    name: Transport Backend Tests (Soft-RoCE)
    needs: [constants]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Catalyst repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.constants.outputs.primary_python_version }}

      - name: Install build and RDMA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang make \
            libibverbs-dev libibverbs1 ibverbs-providers ibverbs-utils \
            rdma-core iproute2
          # Kernel modules for the running Azure kernel; rdma_rxe lives here.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            || sudo apt-get install -y linux-modules-extra-azure
          # Refresh modules.dep so modprobe finds anything newly-installed.
          sudo depmod -a
          # Verify rdma_rxe.ko exists for the running kernel before we try to
          # load it - otherwise `modprobe rdma_rxe` fails with an opaque
          # "Module not found" and it's not obvious the package install was
          # the problem.
          find /lib/modules/$(uname -r) -name 'rdma_rxe*' -print
          test -n "$(find /lib/modules/$(uname -r) -name 'rdma_rxe*' -print -quit)" \
            || { echo "::error::rdma_rxe.ko missing for kernel $(uname -r); the runner image does not ship a Soft-RoCE module. Check GitHub Actions image release notes or pin an older Ubuntu."; exit 1; }
          python3 -m pip install "nanobind<2.13" pybind11

      - name: Configure Soft-RoCE (rxe0 on loopback)
        run: |
          # rdma_rxe provides a software RoCE device. Attach it to `lo` so the
          # runtime's cpu_verbs backend has an ibverbs device named `rxe0` to
          # open. The Catch2 tests SKIP when this device is absent, and
          # run_loopback.sh requires it - both scenarios happen inside
          # make test-transport.
          sudo modprobe rdma_rxe
          sudo rdma link add rxe0 type rxe netdev lo
          rdma link show
          ibv_devices
          ibv_devinfo -d rxe0
          # Fail fast if rxe0 didn't come up - otherwise Catch2 tests would
          # silently SKIP and the loopback would be the only thing exercising it.
          ibv_devices | awk '{print $1}' | grep -q '^rxe0$'

      - name: Get Cached LLVM Source
        id: cache-llvm-source
        uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
          enableCrossOsArchive: true

      - name: Clone LLVM Submodule
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.constants.outputs.llvm_version }}
          path: mlir/llvm-project

      - name: Build Catalyst-Runtime with ENABLE_TRANSPORT=ON
        run: |
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which clang) \
          CXX_COMPILER=$(which clang++) \
          LLVM_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_ASAN=OFF \
          ENABLE_TRANSPORT=ON \
          make runtime

      - name: Run transport test suite (Catch2 + loopback)
        run: |
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which clang) \
          CXX_COMPILER=$(which clang++) \
          LLVM_DIR="$(pwd)/mlir/llvm-project" \
          make test-runtime-transport

      - name: Upload loopback logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transport-loopback-logs
          path: |
            /tmp/cvl_coproc.log
            /tmp/cvl_ctrl.log
          if-no-files-found: ignore
          retention-days: 7
