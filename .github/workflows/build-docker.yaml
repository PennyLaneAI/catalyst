name: Build Catalyst Docker Image on Linux

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      catalyst-version:
        type: string
        required: true
        description: The version of Catalyst to use. This should be a valid git ref.
      lightning-version:
        type: string
        required: false
        default: ''
        description: Lightning git ref (branch, tag or commit SHA) to build from source. Empty uses the version pinned in .dep-versions.
      pennylane-version:
        type: string
        required: false
        default: ''
        description: PennyLane git ref to install from source. Empty uses the version pinned in .dep-versions.
      push-to-dockerhub:
        type: boolean
        required: true
        description: Push to Docker Hub when done.

jobs:
  # Resolves every ref to a commit once, so both arch jobs build the same commits and the
  # tag matches them. Fails immediately on a ref that doesn't exist.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      catalyst: ${{ steps.resolve.outputs.catalyst }}
      pennylane: ${{ steps.resolve.outputs.pennylane }}
      lightning: ${{ steps.resolve.outputs.lightning }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve refs and compute image tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CATALYST_VERSION: ${{ inputs.catalyst-version }}
          PENNYLANE_VERSION: ${{ inputs.pennylane-version }}
          LIGHTNING_VERSION: ${{ inputs.lightning-version }}
        run: |
          set -o pipefail
          sha() { gh api "repos/PennyLaneAI/$1/commits/$2" --jq .sha; }
          pin() { gh api "repos/PennyLaneAI/catalyst/contents/.dep-versions?ref=$catalyst" --jq .content | base64 -d | sed -n "s/^$1=//p"; }
          catalyst=$(sha catalyst "$CATALYST_VERSION")
          pennylane=${PENNYLANE_VERSION:+$(sha pennylane "$PENNYLANE_VERSION")}
          lightning=${LIGHTNING_VERSION:+$(sha pennylane-lightning "$LIGHTNING_VERSION")}
          # Short SHA for refs built from source, the pinned version otherwise.
          pl=${pennylane:0:7}; pl=${pl:-$(pin pennylane)}
          lq=${lightning:0:7}; lq=${lq:-$(pin lightning)}
          TAG="pennylane-$pl-lightning-$lq-catalyst-${catalyst:0:7}"
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::Invalid Docker tag: $TAG"; exit 1; }
          { echo "catalyst=$catalyst"; echo "pennylane=$pennylane"; echo "lightning=$lightning"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"

  docker:
    needs: resolve
    name: docker::ubuntu-24.04::${{ matrix.arch }}::catalyst::${{ inputs.catalyst-version }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: blacksmith-8vcpu-ubuntu-2404 }
          - { arch: arm64, runner: blacksmith-8vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.runner }}
    env:
      # Layer cache for the deps stage (LLVM, StableHLO, Enzyme). Not a runnable image.
      DEPS_CACHE: pennylaneai/pennylane:buildcache-catalyst-deps-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.catalyst }}
          persist-credentials: false

      - name: Read dependency versions
        id: pins
        run: grep -E '^(llvm|stablehlo|enzyme)=' .dep-versions >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ steps.pins.outputs.llvm }}-default-source
          enableCrossOsArchive: true

      - uses: actions/cache/restore@v4
        with:
          path: mlir/stablehlo
          key: stablehlo-${{ steps.pins.outputs.stablehlo }}-default-source
          enableCrossOsArchive: true

      - uses: actions/cache/restore@v4
        with:
          path: mlir/Enzyme
          key: enzyme-${{ steps.pins.outputs.enzyme }}-default-source
          enableCrossOsArchive: true

      - name: Fetch uncached submodules
        run: |
          for d in llvm-project stablehlo Enzyme; do
            [ -n "$(ls -A mlir/$d)" ] || git submodule update --init --depth 1 mlir/$d
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dependencies (LLVM, StableHLO, Enzyme)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: deps
          cache-from: type=registry,ref=${{ env.DEPS_CACHE }}
          # mode=max: cache every layer of the deps build.
          # image-manifest/oci-mediatypes: store the cache in the standard image format
          # so Docker Hub accepts it.
          cache-to: type=registry,ref=${{ env.DEPS_CACHE }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          push: false
          context: .
          file: docker/Dockerfile
          target: catalyst
          tags: pennylaneai/pennylane:${{ needs.resolve.outputs.tag }}
          cache-from: type=registry,ref=${{ env.DEPS_CACHE }}
          build-args: |
            LIGHTNING_VERSION=${{ needs.resolve.outputs.lightning }}
            PENNYLANE_VERSION=${{ needs.resolve.outputs.pennylane }}

      - name: Test
        run: |
          docker run --rm -i pennylaneai/pennylane:${{ needs.resolve.outputs.tag }} python - <<'EOF'
          import pennylane as qp
          qp.about()
          for dev in ["lightning.qubit", "lightning.kokkos"]:
              @qp.qjit
              @qp.qnode(qp.device(dev, wires=1))
              def f():
                  qp.Hadamard(0)
                  return qp.probs()
              assert qp.math.allclose(f(), [0.5, 0.5]), (dev, f())
              print(dev, "qjit ok")
          EOF

      - name: Save image
        run: docker save pennylaneai/pennylane:${{ needs.resolve.outputs.tag }} | gzip > pennylane-catalyst.tar.gz

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pennylane-catalyst-${{ matrix.arch }}
          path: pennylane-catalyst.tar.gz
          retention-days: 1
          compression-level: 0

      # Untagged; publish-multiarch-tag puts both archs under the one real tag.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        if: ${{ inputs.push-to-dockerhub }}
        with:
          context: .
          file: docker/Dockerfile
          target: catalyst
          outputs: type=image,name=pennylaneai/pennylane,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.DEPS_CACHE }}
          build-args: |
            LIGHTNING_VERSION=${{ needs.resolve.outputs.lightning }}
            PENNYLANE_VERSION=${{ needs.resolve.outputs.pennylane }}

      - name: Save digest
        if: ${{ inputs.push-to-dockerhub }}
        run: echo "${{ steps.push.outputs.digest }}" > "${{ runner.temp }}/digest"

      - name: Upload digest
        if: ${{ inputs.push-to-dockerhub }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest
          retention-days: 1

  # Combines the per-arch images under one tag
  publish-multiarch-tag:
    needs: [resolve, docker]
    if: ${{ inputs.push-to-dockerhub }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          docker buildx imagetools create -t "pennylaneai/pennylane:$TAG" \
            $(sed 's|^|pennylaneai/pennylane@|' digests/*/digest)
