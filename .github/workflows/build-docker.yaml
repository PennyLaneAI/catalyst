name: Docker::Linux::Catalyst

permissions:
  contents: read

on:
  push:
    branches: [josephleekl/container]  # TEMP: remove before merge
  workflow_dispatch:
    inputs:
      catalyst-version:
        type: string
        required: true
        description: The version of Catalyst to use. This should be a valid git ref, e.g. v0.14.0.
      lightning-version:
        type: string
        required: false
        default: ''
        description: Lightning git ref to build from source. Empty uses the version pinned in .dep-versions.
      pennylane-version:
        type: string
        required: false
        default: ''
        description: PennyLane git ref to install from source. Empty uses the version pinned in .dep-versions.
      push-to-dockerhub:
        type: boolean
        required: true
        description: Push to Docker Hub when done.

jobs:
  docker:
    name: docker::ubuntu-24.04::${{ matrix.arch }}::catalyst::${{ inputs.catalyst-version }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: blacksmith-8vcpu-ubuntu-2404 }
          - { arch: aarch64, runner: blacksmith-8vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.runner }}
    env:
      # Layer cache for the deps stage (LLVM, StableHLO, Enzyme). Not a runnable image.
      DEPS_CACHE: pennylaneai/pennylane:buildcache-catalyst-deps-${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.catalyst-version }}

      - name: Read dependency versions
        id: pins
        run: grep -E '^(llvm|stablehlo|enzyme|pennylane|lightning)=' .dep-versions >> "$GITHUB_OUTPUT"

      - name: Validate image tag
        id: tag
        if: ${{ inputs.push-to-dockerhub }}
        env:
          TAG: ${{ inputs.catalyst-version }}-catalyst-pl-${{ inputs.pennylane-version || steps.pins.outputs.pennylane }}-lightning-${{ inputs.lightning-version || steps.pins.outputs.lightning }}-${{ matrix.arch }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::Invalid Docker tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Source caches saved by check-catalyst.yaml; much faster than cloning the submodules.
      - uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ steps.pins.outputs.llvm }}-default-source
          enableCrossOsArchive: true

      - uses: actions/cache/restore@v4
        with:
          path: mlir/stablehlo
          key: stablehlo-${{ steps.pins.outputs.stablehlo }}-default-source
          enableCrossOsArchive: true

      - uses: actions/cache/restore@v4
        with:
          path: mlir/Enzyme
          key: enzyme-${{ steps.pins.outputs.enzyme }}-default-source
          enableCrossOsArchive: true

      - name: Fetch uncached submodules
        run: |
          for d in llvm-project stablehlo Enzyme; do
            [ -n "$(ls -A mlir/$d)" ] || git submodule update --init --depth 1 mlir/$d
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dependencies (LLVM, StableHLO, Enzyme)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: deps
          cache-from: type=registry,ref=${{ env.DEPS_CACHE }}
          cache-to: type=registry,ref=${{ env.DEPS_CACHE }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          push: false
          context: .
          file: docker/Dockerfile
          target: catalyst
          tags: test:${{ inputs.catalyst-version || 'ci' }}-catalyst
          cache-from: type=registry,ref=${{ env.DEPS_CACHE }}
          build-args: |
            LIGHTNING_VERSION=${{ inputs.lightning-version }}
            PENNYLANE_VERSION=${{ inputs.pennylane-version }}

      - name: Test
        run: |
          docker run --rm test:${{ inputs.catalyst-version || 'ci' }}-catalyst

      - name: Save image
        run: docker save test:${{ inputs.catalyst-version || 'ci' }}-catalyst | gzip > pennylane-catalyst.tar.gz

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pennylane-catalyst-${{ matrix.arch }}
          path: pennylane-catalyst.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Build and push version
        uses: docker/build-push-action@v6
        if: ${{ inputs.push-to-dockerhub }}
        with:
          push: ${{ inputs.push-to-dockerhub }}
          context: .
          file: docker/Dockerfile
          target: catalyst
          tags: pennylaneai/pennylane:${{ steps.tag.outputs.tag }},pennylaneai/pennylane:latest-catalyst-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.DEPS_CACHE }}
          build-args: |
            LIGHTNING_VERSION=${{ inputs.lightning-version }}
            PENNYLANE_VERSION=${{ inputs.pennylane-version }}
