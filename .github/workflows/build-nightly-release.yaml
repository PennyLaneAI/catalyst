name: Build nightly Catalyst releases for TestPyPI

permissions:
  contents: write

on:
  schedule:
    # Run every weekday at 23:40 EDT (cron is in UTC)
    - cron: "40 3 * * 2-6"
  workflow_dispatch:
    inputs:
      build-linux-arm:
        description: 'Publish ARM wheels for Linux'
        default: false
        required: false
        type: boolean

jobs:
  setup:
    name: Setup the release
    runs-on:
      group: 'PennyLaneAI-Static-IP-Runners'
      labels: ['pl-2-core-gh-runner']
    steps:
    - name: Checkout Catalyst repo
      uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.NIGHTLY_VERSION_UPDATE_DEPLOY_KEY }}

    - name: Bump dev version
      run: |
        python $GITHUB_WORKSPACE/.github/workflows/set_nightly_version.py

    - name: Push new version
      run: |
        git config --global user.email '${{ secrets.AUTO_UPDATE_VERSION_RINGO_EMAIL }}'
        git config --global user.name "ringo-but-quantum"
        git add $GITHUB_WORKSPACE/frontend/catalyst/_version.py
        DEV_VERSION=$(grep __version__ "$GITHUB_WORKSPACE/frontend/catalyst/_version.py" | cut -d'"' -f2 | cut -d'-' -f2)
        git commit -m "[no ci] bump nightly version to ${DEV_VERSION}"
        git push

  # Only build the most popular configurations on a nightly schedule to save PyPI storage.

  linux-x86:
    name: Build on Linux x86-64
    needs: [setup]
    uses: ./.github/workflows/build-wheel-linux-x86_64.yaml
    with:
      build_dev_packages: true

  linux-aarch:
    if: ${{ inputs.build-linux-arm }}
    name: Build on Linux aarch64
    needs: [setup]
    uses: ./.github/workflows/build-wheel-linux-arm64.yaml

  macos-arm:
    name: Build on macOS arm64
    needs: [setup]
    uses: ./.github/workflows/build-wheel-macos-arm64.yaml
    with:
      build_dev_packages: true

  upload:
    name: Prepare & Upload wheels to TestPyPI
    if: ${{ !failure() && !cancelled() }}  # needed in case linux-aarch is skipped
    needs: [linux-x86, macos-arm, linux-aarch]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        pattern: "*wheel*"
        merge-multiple: true
        path: dist

    - name: Install rename
      run: |
        sudo apt install rename

    - name: Prepare wheels
      run: |
        rename "s/linux/manylinux_2_28/" dist/pennylane_catalyst-*
        rename "s/macosx_15_0_universal2/macosx_13_0_arm64/" dist/pennylane_catalyst-*
        rename "s/macosx_15/macosx_13/" dist/pennylane_catalyst-*

    - name: Upload wheels
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist
        verbose: true

  # Publishes the catalyst-dev and catalyst-runtime-dev archives the two jobs above built (they only
  # exist because of `build_dev_packages: true`) to the nightly channel of the dev-package bucket.
  # Independent of the TestPyPI upload job, so a failure on either side does not hold back the
  # other. We skip linux-aarch until we know that it's needed.
  upload-dev-packages:
    name: Upload dev packages to S3
    needs: [linux-x86, macos-arm]
    permissions:
      id-token: write   # OIDC: required for the called workflow to assume the AWS role
      contents: read
      actions: read
    uses: ./.github/workflows/upload-dev-packages.yaml
    with:
      channel: nightly
      platforms: Linux-x86_64,Darwin-arm64
    secrets:
      AWS_ASSUME_S3_ROLE_ARN: ${{ secrets.AWS_ASSUME_S3_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
