name: Check Catalyst Build

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine_runner:
    if: github.event.pull_request.draft == false
    name: Determine runner type to use
    uses: ./.github/workflows/determine-workflow-runner.yml
    with:
      default_runner: ubuntu-24.04

  constants:
    name: "Set build matrix"
    uses: ./.github/workflows/constants.yaml
    needs: [determine_runner]
    with:
      multiple_compilers: ${{ github.trigger == 'push' && github.ref_name == 'main' }}
      runs_on: ${{ needs.determine_runner.outputs.runner_group }}

  transport_changes:
    name: "Detect transport changes"
    runs-on: ubuntu-latest
    outputs:
      transport: ${{ steps.filter.outputs.transport }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need history to diff against the base ref

      - id: filter
        uses: ./.github/actions/transport-path-filter

  hip_amd_toolchain:
    name: "HIP sources build with the AMD toolchain"
    needs: [transport_changes]
    if: needs.transport_changes.outputs.transport == 'true'
    # GH-hosted x86_64: ROCm publishes no arm64 packages, and this needs no GPU -- device-only
    # compilation touches no driver.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the AMD compiler
        run: |
          set -euo pipefail
          # Key to a file rather than piping curl into gpg: a short read leaves a truncated keyring
          # that only surfaces later as an unresolvable package.
          curl -fsSL --retry 3 https://repo.radeon.com/rocm/rocm.gpg.key -o /tmp/rocm.gpg.key
          sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg < /tmp/rocm.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.1.1 noble main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list > /dev/null

          # Pin above Ubuntu universe: its libamdhip64-dev 5.7.1 headers shadow ROCm's and predate
          # hipMemRangeHandleTypeDmaBufFd, so the compile fails on an enum that does exist in 7.1.1.
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/rocm > /dev/null

          sudo apt-get update
          # rocm-device-libs carries the amdgcn bitcode, without which amdclang++ refuses device
          # compilation; hip-runtime-amd brings the AMD-side HIP headers.
          sudo apt-get install -y --no-install-recommends \
            rocm-llvm hip-runtime-amd hip-dev rocm-device-libs
          echo "/opt/rocm/bin" >> $GITHUB_PATH

      - name: Compile the .hip sources for CDNA4 and CDNA2
        run: OFFLOAD_ARCHES="gfx950 gfx90a" runtime/prototypes/amd_hip_compile/compile_check.sh

  runtime:
    name: Catalyst-Runtime Build
    needs: [constants, transport_changes, determine_runner, llvm]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}
    strategy:
      matrix:
        compiler: ${{ fromJson(needs.constants.outputs.compilers) }}

    steps:
      - name: Checkout Catalyst repo
        uses: actions/checkout@v4

      - name: Set up Python # Ensure the "primary" python version is used
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.constants.outputs.primary_python_version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libibverbs-dev: without it the RDMA backends are silently skipped at configure time.
          # ccache is picked up by runtime/Makefile's COMPILER_LAUNCHER default.
          sudo apt-get -y -q install ninja-build make cmake ccache clang libibverbs-dev
          python3 -m pip install "nanobind<2.13" pybind11 numpy PyYAML

      - name: Get Cached LLVM Source
        id: cache-llvm-source
        uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
          enableCrossOsArchive: true

      - name: Clone LLVM Submodule
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.constants.outputs.llvm_version }}
          path: mlir/llvm-project

      # Key is job+compiler scoped: sharing with the quantum job's disjoint TUs means ~0% hits.
      - name: Restore CCache on feature branches
        id: restore-ccache
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-runtime-${{ matrix.compiler }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-runtime-${{ matrix.compiler }}-

      # Restore instead of letting Makefile's `runtime: llvm` rebuild into another dir (~9 min).
      - name: Get Cached LLVM Build
        if: needs.transport_changes.outputs.transport == 'true' && matrix.compiler == 'gcc'
        uses: actions/cache/restore@v4
        with:
          path: llvm-build
          key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-${{ matrix.compiler }}
          fail-on-cache-miss: true

      - name: Build Catalyst-Runtime
        env:
          # ON only for transport-touching PRs; the rest skip the transport backends entirely.
          ENABLE_TRANSPORT: ${{ needs.transport_changes.outputs.transport == 'true' && 'ON' || 'OFF' }}
          # The out-of-process loopback test launches a catalyst-executor subprocess. gcc only:
          # the executor links LLVM, and clang would pay that again for a binary nothing uses.
          ENABLE_EXECUTOR: ${{ needs.transport_changes.outputs.transport == 'true' && matrix.compiler == 'gcc' && 'ON' || 'OFF' }}
        run: |
          # `-C runtime`, not the top-level target: that one would rebuild llvm despite the restore.
          CCACHE_DIR="$(pwd)/.ccache" \
          C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
          CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_BUILD_DIR="$(pwd)/llvm-build" \
          LLVM_SRC_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_ASAN=OFF \
          ENABLE_TRANSPORT="$ENABLE_TRANSPORT" \
          ENABLE_EXECUTOR="$ENABLE_EXECUTOR" \
          make -C runtime runtime ENABLE_OQD=ON

          CCACHE_DIR="$(pwd)/.ccache" \
          C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
          CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          OQC_BUILD_DIR="$(pwd)/oqc-build" \
          LLVM_SRC_DIR="$(pwd)/mlir/llvm-project" \
          make oqc

      # gcc only: the tests aren't compiler-sensitive, so running them under both compilers on
      # push-to-main just burns runner time. Soft-RoCE also mutates the runner's RDMA links.
      - name: Set up Soft-RoCE loopback (transport tests only)
        if: needs.transport_changes.outputs.transport == 'true' && matrix.compiler == 'gcc'
        uses: ./.github/actions/setup-soft-roce

      - name: Run transport C++ test suite (Catch2 + soft-RoCE loopback)
        if: needs.transport_changes.outputs.transport == 'true' && matrix.compiler == 'gcc'
        run: |
          # Same ENABLE_* flags and RT_BUILD_DIR as the Build step, so `test_runner: configure`
          # does not reset the cmake cache and drop the already-built .sos.
          CCACHE_DIR="$(pwd)/.ccache" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_OQD=ON \
          ENABLE_TRANSPORT=ON \
          make test-runtime-transport

      - name: Upload Catalyst-Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build-${{ matrix.compiler }}
          # catalyst-executor exists only on transport PRs; if-no-files-found stays `warn`.
          path: |
            runtime-build/lib/*.so
            runtime-build/lib/backend/*.toml
            runtime-build/lib/catalyst-executor
          retention-days: 1

      - name: Upload OQC-Runtime Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oqc-build-${{ matrix.compiler }}
          path: |
            oqc-build/*.so
            oqc-build/backend/*.toml
          retention-days: 1

      # Only main pushes save; feature branches read the newest main-populated cache above.
      - name: Cache CCache on main branch
        id: save-ccache
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-runtime-${{ matrix.compiler }}-${{ github.run_id }}

  llvm:
    name: LLVM Build
    needs: [constants, determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}
    strategy:
      matrix:
        compiler: ${{ fromJson(needs.constants.outputs.compilers) }}

    steps:
    - name: Checkout Catalyst repo
      uses: actions/checkout@v4

    # Both the LLVM source and build folder are required for further dialect builds.
    # Caching is significantly faster than git cloning since LLVM is such a large repository.

    - name: Cache LLVM Source
      id: cache-llvm-source
      uses: actions/cache@v4
      with:
        path: mlir/llvm-project
        key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
        enableCrossOsArchive: true

    - name: Clone LLVM Submodule
      if: steps.cache-llvm-source.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: llvm/llvm-project
        ref: ${{ needs.constants.outputs.llvm_version }}
        path: mlir/llvm-project

    - name: Cache LLVM Build
      id: cache-llvm-build
      uses: actions/cache@v4
      with:
        path: llvm-build
        key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-${{ matrix.compiler }}

    - name: Set up Python # Ensure the "primary" python version is used
      uses: actions/setup-python@v5
      with:
        python-version: ${{needs.constants.outputs.primary_python_version}}

    - name: Install Deps
      if: steps.cache-llvm-build.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip cmake ninja-build clang lld

        python3 --version | grep ${{ needs.constants.outputs.primary_python_version }}
        python3 -m pip install numpy pybind11 "nanobind<2.13" PyYAML

    - name: Build LLVM
      if: steps.cache-llvm-build.outputs.cache-hit != 'true'
      # Note: Disable instrumentation for the mlir runtime support library,
      #       as user programs aren't instrumented.
      run: |
        # echo 'target_compile_options(mlir_c_runner_utils PRIVATE "-fno-sanitize=all")' \
        #       >> mlir/llvm-project/mlir/lib/ExecutionEngine/CMakeLists.txt
        C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
        CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        COMPILER_LAUNCHER="" \
        make llvm

  stablehlo:
    name: Stablehlo Dialect Build
    needs: [constants, llvm, determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}
    strategy:
      matrix:
        compiler: ${{ fromJson(needs.constants.outputs.compilers) }}

    steps:
    - name: Checkout Catalyst repo
      uses: actions/checkout@v4

    - name: Set up Python # Ensure the "primary" python version is used
      uses: actions/setup-python@v5
      with:
        python-version: ${{ needs.constants.outputs.primary_python_version }}

    - name: Cache Stablehlo Source
      id: cache-stablehlo-source
      uses: actions/cache@v4
      with:
        path: mlir/stablehlo
        key: stablehlo-${{ needs.constants.outputs.stablehlo_version }}-default-source
        enableCrossOsArchive: true

    - name: Clone Stablehlo Submodule
      if: steps.cache-stablehlo-source.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: openxla/stablehlo
        ref: ${{ needs.constants.outputs.stablehlo_version }}
        path: mlir/stablehlo

    - name: Cache Stablehlo Build
      id: cache-stablehlo
      uses: actions/cache@v4
      with:
        path: stablehlo-build
        key: ${{ runner.os }}-stablehlo-${{ needs.constants.outputs.stablehlo_version }}-ci-build-${{ matrix.compiler }}-0

    - name: Get Cached LLVM Source
      id: cache-llvm-source
      if: steps.cache-stablehlo.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: mlir/llvm-project
        key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Get Cached LLVM Build
      id: cache-llvm-build
      if: steps.cache-stablehlo.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: llvm-build
        key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-${{ matrix.compiler }}
        fail-on-cache-miss: true

    - name: Install Deps
      if: steps.cache-stablehlo.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang lld
    - name: Build Stablehlo Dialect
      if: steps.cache-stablehlo.outputs.cache-hit != 'true'
      run: |
        C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
        CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
        COMPILER_LAUNCHER="" \
        make stablehlo

  enzyme:
    name: Enzyme Build
    needs: [constants, llvm, determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}
    strategy:
      matrix:
        compiler: ${{ fromJson(needs.constants.outputs.compilers) }}

    steps:
    - name: Checkout Catalyst repo
      uses: actions/checkout@v4

    - name: Set up Python # Ensure the "primary" python version is used
      uses: actions/setup-python@v5
      with:
        python-version: ${{ needs.constants.outputs.primary_python_version }}

    - name: Cache Enzyme Source
      id: cache-enzyme-source
      uses: actions/cache@v4
      with:
        path:  mlir/Enzyme
        key: enzyme-${{ needs.constants.outputs.enzyme_version }}-default-source
        enableCrossOsArchive: true

    - name: Clone Enzyme Submodule
      if: steps.cache-enzyme-build.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: EnzymeAD/Enzyme
        ref: ${{ needs.constants.outputs.enzyme_version }}
        path: mlir/Enzyme

    - name: Cache Enzyme Build
      id: cache-enzyme-build
      uses: actions/cache@v4
      with:
        path: enzyme-build
        key: ${{ runner.os }}-enzyme-${{ needs.constants.outputs.llvm_version }}-${{ needs.constants.outputs.enzyme_version }}-ci-build-${{ matrix.compiler }}

    - name: Get Cached LLVM Source
      id: cache-llvm-source
      if: steps.cache-enzyme-build.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: mlir/llvm-project
        key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Get Cached LLVM Build
      id: cache-llvm-build
      if: steps.cache-enzyme-build.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: llvm-build
        key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-${{ matrix.compiler }}
        fail-on-cache-miss: true

    - name: Install Deps
      if: steps.cache-enzyme-build.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang lld

    - name: Build Enzyme
      if: steps.cache-enzyme-build.outputs.cache-hit != 'true'
      run: |
        C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
        CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
        COMPILER_LAUNCHER="" \
        make enzyme

  quantum:
    name: Quantum Dialects Build
    needs: [constants, llvm, stablehlo, enzyme, determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}
    strategy:
      matrix:
        compiler: ${{ fromJson(needs.constants.outputs.compilers) }}

    steps:
    - name: Checkout Catalyst repo
      uses: actions/checkout@v4

    - name: Set up Python # Ensure the "primary" python version is used
      uses: actions/setup-python@v5
      with:
        python-version: ${{ needs.constants.outputs.primary_python_version }}

    - name: Install Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip cmake ninja-build ccache clang lld
        python3 --version | grep ${{ needs.constants.outputs.primary_python_version }}
        python3 -m pip install numpy "nanobind<2.13" pybind11

    - name: Get Cached LLVM Source
      id: cache-llvm-source
      uses: actions/cache/restore@v4
      with:
        path: mlir/llvm-project
        key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Get Cached LLVM Build
      id: cache-llvm-build
      uses: actions/cache/restore@v4
      with:
        path: llvm-build
        key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-${{ matrix.compiler }}
        fail-on-cache-miss: true

    - name: Get Cached Stablehlo Source
      id: cache-stablehlo-source
      uses: actions/cache/restore@v4
      with:
        path: mlir/stablehlo
        key: stablehlo-${{ needs.constants.outputs.stablehlo_version }}-default-source
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Get Cached Stablehlo Build
      id: cache-stablehlo
      uses: actions/cache/restore@v4
      with:
        path: stablehlo-build
        key: ${{ runner.os }}-stablehlo-${{ needs.constants.outputs.stablehlo_version }}-ci-build-${{ matrix.compiler }}-0
        fail-on-cache-miss: true

    - name: Get Cached Enzyme Source
      id: cache-enzyme-source
      uses: actions/cache/restore@v4
      with:
        path:  mlir/Enzyme
        key: enzyme-${{ needs.constants.outputs.enzyme_version }}-default-source
        enableCrossOsArchive: true
        fail-on-cache-miss: true

    - name: Get Cached Enzyme Build
      id: cache-enzyme-build
      uses: actions/cache/restore@v4
      with:
        path: enzyme-build
        key: ${{ runner.os }}-enzyme-${{ needs.constants.outputs.llvm_version }}-${{ needs.constants.outputs.enzyme_version }}-ci-build-${{ matrix.compiler }}
        fail-on-cache-miss: true

    - name: Restore CCache on feature branches
      id: restore-ccache
      if: ${{ github.ref != 'refs/heads/main' }}
      uses: actions/cache/restore@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ github.run_id }}
        restore-keys: ${{ runner.os }}-ccache-

    - name: Build MLIR Dialects
      run: |
        CCACHE_DIR="$(pwd)/.ccache" \
        C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
        CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
        ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
        DIALECTS_BUILD_DIR="$(pwd)/quantum-build" \
        make dialects

    - name: Build MLIR Dialect Docs
      run: |
        CCACHE_DIR="$(pwd)/.ccache" \
        C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
        CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
        ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
        DIALECTS_BUILD_DIR="$(pwd)/quantum-build" \
        make dialect-docs

    - name: Build Standalone Plugin
      run: |
        CCACHE_DIR="$(pwd)/.ccache" \
        C_COMPILER=$(which ${{ needs.constants.outputs[format('c_compiler.{0}', matrix.compiler)] }}) \
        CXX_COMPILER=$(which ${{ needs.constants.outputs[format('cxx_compiler.{0}', matrix.compiler)] }}) \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        MLIR_DIR="$(pwd)/llvm-build/lib/cmake/mlir" \
        make plugin
        mkdir -p $(pwd)/quantum-build/lib
        mv mlir/standalone/build/lib/StandalonePlugin.so "$(pwd)/quantum-build/lib"

    - name: Upload Quantum Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: quantum-build-${{ matrix.compiler }}
        path: |
          quantum-build/bin
          quantum-build/python_packages/*
          quantum-build/lib/StandalonePlugin.so
          quantum-build/lib/default_pipelines.*
          quantum-build/lib/libQuantumPythonDecompositions.*
        retention-days: 1

    - name: Cache CCache on main branch
      id: save-ccache
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ github.run_id }}

  frontend-tests:
    name: Frontend Tests
    needs: [constants, transport_changes, llvm, runtime, quantum, determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}
    strategy:
      matrix:
        compiler: ${{ fromJson(needs.constants.outputs.compilers) }}

    steps:
    - name: Checkout Catalyst repo
      uses: actions/checkout@v4

    - name: Set up Python # Ensure the "primary" python version is used
      uses: actions/setup-python@v5
      with:
        python-version: ${{ needs.constants.outputs.primary_python_version }}

    - name: Get Cached LLVM Build
      id: cache-llvm-build
      uses: actions/cache@v4
      with:
        path: llvm-build
        key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-${{ matrix.compiler }}
        fail-on-cache-miss: true

    - name: Download Quantum Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: quantum-build-${{ matrix.compiler }}
        path: quantum-build

    - name: Download Catalyst-Runtime Artifact
      uses: actions/download-artifact@v4
      with:
        name: runtime-build-${{ matrix.compiler }}
        path: runtime-build/lib

    - name: Download OQC-Runtime Artifact
      uses: actions/download-artifact@v4
      with:
        name: oqc-build-${{ matrix.compiler }}
        path: oqc-build

    - name: Add Frontend Dependencies to PATH
      run: |
        echo "$(pwd)/llvm-build/bin" >> $GITHUB_PATH
        echo "$(pwd)/quantum-build/bin" >> $GITHUB_PATH
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)/quantum-build/python_packages/quantum" >> $GITHUB_ENV
        echo "RUNTIME_LIB_DIR=$(pwd)/runtime-build/lib" >> $GITHUB_ENV
        echo "MLIR_LIB_DIR=$(pwd)/llvm-build/lib" >> $GITHUB_ENV
        echo "OQC_LIB_DIR=$(pwd)/oqc-build" >> $GITHUB_ENV
        echo "OQD_LIB_DIR=$(pwd)/runtime-build/lib" >> $GITHUB_ENV
        echo "CATALYST_BIN_DIR=$(pwd)/quantum-build/bin" >> $GITHUB_ENV
        echo "CATALYST_LIB_DIR=$(pwd)/quantum-build/lib" >> $GITHUB_ENV
        chmod +x $(pwd)/quantum-build/bin/catalyst  # artifact upload does not preserve permissions

    - name: Make catalyst-executor executable (transport tests only)
      # Same permission loss as the line above, on the binary the out-of-process loopback
      # test launches. It is found beside the runtime libraries, so it stays where it is.
      if: needs.transport_changes.outputs.transport == 'true' && matrix.compiler == 'gcc'
      run: chmod +x $(pwd)/runtime-build/lib/catalyst-executor

    - name: Set up Soft-RoCE loopback (transport tests only)
      # test_local_cpu_to_local_cpu_rdma_loopback runs both roles in this process and has them
      # reach each other over rxe0 (soft-RoCE loopback).
      if: needs.transport_changes.outputs.transport == 'true' && matrix.compiler == 'gcc'
      uses: ./.github/actions/setup-soft-roce

    - name: Install Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libasan6 make
        python3 --version | grep ${{ needs.constants.outputs.primary_python_version }}
        python3 -m pip install -r requirements.txt
        python3 -m pip install oqc-qcaas-client
        # Install graphviz for testing the mlir-op-graph integration
        sudo apt-get install -y graphviz
        make frontend

    - name: Verify Graphviz installation
      run: |
        dot -V
        dot -Tpng -o test.png <<<'digraph { a -> b }' # Verify a png can be rendered

    - name: Run backline transport integration tests
      # Only the CPU cases; the GPU-coproc ones need the self-hosted runner (check-transport-gpu).
      if: needs.transport_changes.outputs.transport == 'true' && matrix.compiler == 'gcc'
      env:
        CATALYST_TRANSPORT_PATH: ${{ github.workspace }}/runtime-build/lib
      run: |
        # -rs so a skip is visible: pytest exits 0 on skip and these have no skip conditions,
        # so anything reported is a regression. _rdma_loopback selects both of its cases.
        python3 -m pytest -v -rs \
          "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_local_cpu_to_local_cpu_memcpy" \
          "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_local_cpu_to_local_cpu_rdma_loopback"

    - name: Run Python Pytest/Lit Tests
      run: |
        COVERAGE_REPORT="xml" \
        DIALECTS_BUILD_DIR="$(pwd)/quantum-build" \
        LLVM_BUILD_DIR="$(pwd)/llvm-build" \
        make coverage-frontend ENABLE_OQD=ON
        mv coverage.xml coverage-${{ github.job }}.xml

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Check Catalyst Demos
      run: | # Do not run demos in parallel, seems to cause package issues with numpy.
        # Some demos fail with optax dependency pulling in latest jax
        # We skip them for now. These demos should be properly moved to the qml repo.
        MDD_BENCHMARK_PRECISION=1 \
        python3 -m pytest demos -k "tutorial_qft_arithmetics.ipynb" --nbmake

  frontend-tests-lightning-kokkos:
    name: Frontend Tests (backend="lightning.kokkos")
    needs: [constants, llvm, runtime, quantum, determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}
    strategy:
      matrix:
        compiler: ${{ fromJson(needs.constants.outputs.compilers) }}

    steps:
    - name: Checkout Catalyst repo
      uses: actions/checkout@v4

    - name: Set up Python # Ensure the "primary" python version is used
      uses: actions/setup-python@v5
      with:
        python-version: ${{ needs.constants.outputs.primary_python_version }}

    - name: Get Cached LLVM Build
      id: cache-llvm-build
      uses: actions/cache@v4
      with:
        path: llvm-build
        key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-${{ matrix.compiler }}
        fail-on-cache-miss: true

    - name: Download Quantum Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: quantum-build-${{ matrix.compiler }}
        path: quantum-build

    - name: Download Catalyst-Runtime Artifact
      uses: actions/download-artifact@v4
      with:
        name: runtime-build-${{ matrix.compiler }}
        path: runtime-build/lib

    - name: Add Frontend Dependencies to PATH
      run: |
        echo "PYTHONPATH=$PYTHONPATH:$(pwd)/quantum-build/python_packages/quantum" >> $GITHUB_ENV
        echo "RUNTIME_LIB_DIR=$(pwd)/runtime-build/lib" >> $GITHUB_ENV
        echo "MLIR_LIB_DIR=$(pwd)/llvm-build/lib" >> $GITHUB_ENV
        echo "CATALYST_BIN_DIR=$(pwd)/quantum-build/bin" >> $GITHUB_ENV
        echo "CATALYST_LIB_DIR=$(pwd)/quantum-build/lib" >> $GITHUB_ENV
        chmod +x $(pwd)/quantum-build/bin/catalyst  # artifact upload does not preserve permissions

    - name: Install Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libasan6 make
        python3 --version | grep ${{ needs.constants.outputs.primary_python_version }}
        python3 -m pip install -r requirements.txt
        make frontend

    - name: Run Python Pytest Tests (backend=lightning.kokkos)
      run: |
        # Don't run xDSL tests
        make pytest TEST_BACKEND="lightning.kokkos" XDSL_TESTS=OFF

