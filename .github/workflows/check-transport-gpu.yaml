name: Check Catalyst GPU

# Runs the transport tests on a GPU host. PRs need the ``gpu`` label; pushes to main always run.

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/lib/transport/**"
      - "runtime/include/Transport*"
      - "runtime/tests/Test_Transport*"
      - "mlir/lib/Transport/**"
      - "mlir/include/Transport/**"
      - "frontend/catalyst/backline.py"
      - "frontend/test/pytest/test_backline.py"
      - "frontend/test/pytest/conftest.py"
      - ".github/workflows/check-transport-gpu.yaml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
    paths:
      - "runtime/lib/transport/**"
      - "runtime/include/Transport*"
      - "runtime/tests/Test_Transport*"
      - "mlir/lib/Transport/**"
      - "mlir/include/Transport/**"
      - "frontend/catalyst/backline.py"
      - "frontend/test/pytest/test_backline.py"
      - "frontend/test/pytest/conftest.py"
      - ".github/workflows/check-transport-gpu.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the PR (or ref) and the event, not the commit. Keying on the commit meant a new push
  # started a new group instead of superseding the old one: three runs of this branch were seen
  # building LLVM at once on the same GPU host, with the newest queued behind them. The event is
  # in the key so a workflow_dispatch still does not cancel the pull_request run of the same code.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  constants:
    name: Set build matrix
    uses: ./.github/workflows/constants.yaml

  gpu-transport-tests:
    name: Runtime transport tests (GPU)
    needs: [constants]
    runs-on:
      - single-gpu-x64

    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'gpu')
        )
      }}

    steps:
      - name: Update PATH and LD_LIBRARY_PATH for CUDA
        run: |
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> $GITHUB_ENV

      - name: Wait for the GPU to be usable
        # `single-gpu-x64` hands out a freshly booted instance, and cuInit has been seen
        # failing minutes into a run; building the MLIR stack from source used to hide that,
        # and the cache took the delay away. Waits on what the tests need: cuInit (via ctypes,
        # torch is installed much later) and the compute_cap query the fixture itself runs.
        # A GPU that answers and then disappears is a runner-image bug, not one to fix here.
        run: |
          set -u
          # `bash -e` is the step default, and a probe failing is the measurement here.
          set +e

          # ctypes, not torch: torch is not installed until much later in the job.
          cuinit='
          import ctypes, sys
          try:
              sys.exit(0 if ctypes.CDLL("libcuda.so.1").cuInit(0) == 0 else 1)
          except OSError:
              sys.exit(1)
          '

          # A fresh instance needs a moment; 5 min then give up.
          for _ in $(seq 1 30); do
            cc=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader 2>&1 | head -1)
            if python3 -c "$cuinit"; then
              case "$cc" in
                [0-9]*.[0-9]*)
                  echo "GPU ready: compute capability $cc"
                  nvidia-smi
                  exit 0
                  ;;
              esac
            fi
            sleep 10
          done

          echo "::error::GPU not usable within 5 minutes, so the backline tests would skip" \
               "and this job would cover nothing. Last compute_cap: '$cc'."
          nvidia-smi
          ls -l /dev/nvidia*
          exit 1

      - name: Checkout Catalyst repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.constants.outputs.primary_python_version }}

      - name: Install build dependencies and resolve the toolchain
        # LLVM_BUILD_DIR and its siblings stay on the frontend build step: runtime's Makefile
        # reads it, and the runtime build runs before that tree exists. CATALYST_LIB_DIR is
        # set here so the frontend build sees it, or precompile_decomposition_rules only warns.
        run: |
          python3 -m pip install "cmake>=3.26" ninja "nanobind<2.13" pybind11 numpy PyYAML
          {
            echo "C_COMPILER=$(which gcc)"
            echo "CXX_COMPILER=$(which g++)"
            echo "RT_BUILD_DIR=$(pwd)/runtime-build"
            echo "DIALECTS_BUILD_DIR=$(pwd)/quantum-build"
            echo "CATALYST_LIB_DIR=$(pwd)/quantum-build/lib"
            echo "PYTHONPATH=${PYTHONPATH:-}:$(pwd)/quantum-build/python_packages/quantum"
          } >> "$GITHUB_ENV"

      - name: Install the HIP headers
        # nvcc is the HIP compiler on this host; ROCm supplies only the headers. `apt-get
        # download` rather than `install`: hip-dev Depends on rocm-llvm and comgr, 611 MB of
        # AMD-GPU toolchain nothing here uses. 7.1+ for the dma-buf API, absent from 6.4.
        # Both packages are MIT (c) AMD, fetched and not redistributed.
        #
        # Suite and versions are pinned together -- if the pool image stops being jammy the
        # pinned versions will not resolve and this fails, rather than silently skipping the
        # GPU tests later.
        run: |
          set -euo pipefail
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg]" \
               "https://repo.radeon.com/rocm/apt/7.1.1 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          tmp=$(mktemp -d)
          ( cd "$tmp" && apt-get download \
              hip-dev=7.1.52802.70101-38~22.04 \
              hipcc-nvidia=1.1.1.70101-38~22.04 )
          for deb in "$tmp"/*.deb; do sudo dpkg-deb -x "$deb" /; done
          rm -rf "$tmp"
          # An unmatched glob stays literal, so check rather than exporting a path that does
          # not exist -- CMake would just not find HIP and the GPU tests would skip.
          rocm=$(echo /opt/rocm-*)
          [ -d "$rocm" ] || { echo "::error::hip-dev did not unpack to /opt/rocm-*"; exit 1; }
          echo "ROCM_PATH=$rocm" >> $GITHUB_ENV

      - name: Get Cached LLVM Source
        id: cache-llvm-source
        uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
          enableCrossOsArchive: true

      - name: Clone LLVM Submodule
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.constants.outputs.llvm_version }}
          path: mlir/llvm-project

      # ENABLE_EXECUTOR is left OFF: the out-of-process executor cases reach the coprocessor
      # over RDMA, and this host has no RDMA-capable NIC, so only the memcpy tests run here.
      # That also keeps the build to LLVM source headers alone (header-only via rt_capi).
      - name: Build Catalyst-Runtime with transport enabled
        run: |
          LLVM_SRC_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_TRANSPORT=ON \
          make runtime

      - name: Verify the GPU coprocessor backend was built
        # A missing .so makes gpu_transport_backend skip, which reads as "tests passed". No
        # ROCm here: lib/transport/CMakeLists.txt fetches the HIP headers and nvcc drives them.
        run: |
          name=libcatalyst_transport_memcpy_gpu_coprocessor.so
          if ! find "$RT_BUILD_DIR/lib" -name "$name" -print | grep -q .; then
            echo "::error::$name was not built -- CMake did not resolve HIP."
            grep -E "^(_nvcc|_hip_include_dir|CMAKE_HIP_|TRANSPORT_HIP_PACKAGES)" \
              "$RT_BUILD_DIR/CMakeCache.txt" || echo "(no HIP entries in the cache at all)"
            exit 1
          fi

      - name: Build and run the memcpy transport tests
        run: |
          cmake --build "$RT_BUILD_DIR" --target runner_tests_transport_memcpy -j
          "$RT_BUILD_DIR/tests/runner_tests_transport_memcpy"

      - name: Install Python runtime requirements
        run: |
          python3 -m pip install -r requirements.txt

      - name: Set up Triton and its CUDA driver
        # Triton dlopens libcuda.so.1, which ships with the driver, not the toolkit -- the stubs
        # copy links but cannot initialize a device ("0 active drivers"). Resolve the real one.
        run: |
          set -euo pipefail
          # torch exists only so triton <3.8 can probe the driver through it. cu129 matches the
          # gpu_runners driver; default torch targets CUDA 13 and leaves cuda.is_available()
          # false. The cap fails a bump past triton 3.8, whose PTX this ptxas rejects.
          pip install 'torch==2.13.0+cu129' 'triton<3.8' \
            --index-url https://download.pytorch.org/whl/cu129

          # One awk, not grep | head: it skips the stubs and exits 0 on no match, so pipefail
          # needs no `|| true`. The find covers a stale loader cache, which is also the only
          # case where prepending to LD_LIBRARY_PATH below does anything.
          libcuda=$(ldconfig -p | awk '/libcuda\.so\.1/ && !/stubs/ {print $NF; exit}')
          if [ -z "$libcuda" ]; then
            libcuda=$(find /usr/lib /usr/lib64 -name 'libcuda.so.1' -not -path '*/stubs/*' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$libcuda" ]; then
            echo "::error::No real libcuda.so.1 here -- only the toolkit stub, if that."
            ldconfig -p | grep -i libcuda || echo "(no libcuda in the loader cache at all)"
            exit 1
          fi

          # Exported for the check below, written to the environment file for later steps.
          libcuda_dir=$(dirname "$libcuda")
          echo "libcuda: $libcuda"
          export TRITON_LIBCUDA_PATH="$libcuda_dir"
          export LD_LIBRARY_PATH="$libcuda_dir${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          echo "TRITON_LIBCUDA_PATH=$libcuda_dir" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV

          # Triton's own activation, which the fixture turns into a skip. A different question
          # from the wait step's cuInit: this one goes through torch.
          python3 -c "
          import triton
          from triton.runtime.driver import driver
          print('triton', triton.__version__, '| active driver:', driver.active)
          "

      # After the pip steps: requirements.txt pins numpy/nanobind/pybind11, which the MLIR
      # bindings compile against. Late, because a cache miss here costs two hours.
      - name: Restore or build LLVM, StableHLO and Enzyme
        uses: ./.github/actions/build-mlir-stack
        with:
          llvm-version: ${{ needs.constants.outputs.llvm_version }}
          stablehlo-version: ${{ needs.constants.outputs.stablehlo_version }}
          enzyme-version: ${{ needs.constants.outputs.enzyme_version }}
          # Cache entries are ref-scoped, so a push to main is what seeds every branch. Own
          # keys, because check-catalyst.yaml builds on 24.04 and its mlir-tblgen needs a
          # newer GLIBC than this jammy host has.

      - name: Build Catalyst frontend (reusing the transport-enabled runtime)
        run: |
          ENABLE_LLD=ON \
          LLVM_BUILD_DIR="$(pwd)/llvm-build" \
          STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
          ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
          ENABLE_TRANSPORT=ON \
          make catalyst

      - name: Add Frontend Dependencies to PATH
        run: |
          echo "$(pwd)/llvm-build/bin" >> $GITHUB_PATH
          echo "$DIALECTS_BUILD_DIR/bin" >> $GITHUB_PATH
          echo "RUNTIME_LIB_DIR=$RT_BUILD_DIR/lib" >> $GITHUB_ENV
          echo "MLIR_LIB_DIR=$(pwd)/llvm-build/lib" >> $GITHUB_ENV
          echo "CATALYST_BIN_DIR=$DIALECTS_BUILD_DIR/bin" >> $GITHUB_ENV
          echo "CATALYST_TRANSPORT_PATH=$RT_BUILD_DIR/lib" >> $GITHUB_ENV

      - name: Run backline GPU integration tests
        id: gpu-tests
        env:
          # Without this Triton discards ptxas diagnostics, leaving codegen failures as "status 255".
          TRITON_DUMP_PTXAS_LOG: "1"
        # CPU-CPU memcpy is covered by check-catalyst.yaml; these three need the local GPU,
        # and -rs makes the gpu_transport_backend / gpu_triton_platform skips visible.
        run: |
          python3 -m pytest -v -rs --junit-xml=gpu-backline-results.xml \
            "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_cpu_controller_to_gpu_coproc_memcpy_precompiled" \
            "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_cpu_controller_to_gpu_coproc_triton_css_bp" \
            "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_cpu_controller_to_gpu_coproc_memcpy_manual_qec"

      - name: Require at least one GPU test to have executed
        # pytest exits 0 when every test skips, so success could cover nothing. Skipped when
        # pytest never ran: no junit file, and the real error is already reported.
        if: always() && steps.gpu-tests.outcome != 'skipped'
        run: |
          python3 - gpu-backline-results.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          s = r if r.tag == "testsuite" else r[0]
          total, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"{total - skipped}/{total} backline GPU tests executed ({skipped} skipped)")
          if total == skipped:
              sys.exit("::error::No backline GPU test executed -- refusing to report "
                       "success for a run with zero GPU coverage.")
          PY
