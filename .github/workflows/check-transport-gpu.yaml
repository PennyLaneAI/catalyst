name: Check Catalyst GPU

# Runs the runtime transport tests on a GPU host. To keep GPU runner time cheap, pull requests
# only trigger a run once labeled ``gpu``; ``push`` to main runs unconditionally.

on:
  push:
    branches: [ main ]
    paths:
      - "runtime/lib/transport/**"
      - "runtime/include/Transport*"
      - "runtime/tests/Test_Transport*"
      - "mlir/lib/Transport/**"
      - "mlir/include/Transport/**"
      - "frontend/catalyst/backline.py"
      - "frontend/test/pytest/test_backline.py"
      - "frontend/test/pytest/conftest.py"
      - ".github/workflows/check-transport-gpu.yaml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
    paths:
      - "runtime/lib/transport/**"
      - "runtime/include/Transport*"
      - "runtime/tests/Test_Transport*"
      - "mlir/lib/Transport/**"
      - "mlir/include/Transport/**"
      - "frontend/catalyst/backline.py"
      - "frontend/test/pytest/test_backline.py"
      - "frontend/test/pytest/conftest.py"
      - ".github/workflows/check-transport-gpu.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the commit, not github.ref: a pull_request and a workflow_dispatch of the same commit
  # carry different refs, so a ref-keyed group let both run and contend for the single GPU.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  constants:
    name: Set build matrix
    uses: ./.github/workflows/constants.yaml

  gpu-transport-tests:
    name: Runtime transport tests (GPU)
    needs: [constants]
    runs-on:
      - single-gpu-x64

    # Push always runs; PRs need a non-draft open state and the ``gpu`` label.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'gpu')
        )
      }}

    steps:
      - name: Update PATH and LD_LIBRARY_PATH for CUDA
        run: |
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> $GITHUB_ENV

      - name: Checkout Catalyst repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.constants.outputs.primary_python_version }}

      - name: Install Python build dependencies
        run: |
          python3 -m pip install "cmake>=3.26" ninja "nanobind<2.13" pybind11 numpy PyYAML

      - name: Get Cached LLVM Source
        id: cache-llvm-source
        uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
          enableCrossOsArchive: true

      - name: Clone LLVM Submodule
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.constants.outputs.llvm_version }}
          path: mlir/llvm-project

      # The runtime configure + build only needs LLVM source headers (MLIR_INCLUDE_DIRS
      # -> mlir/llvm-project/mlir/include, header-only via rt_capi). No built-LLVM
      # artifacts are consumed as long as ENABLE_EXECUTOR stays OFF, which it does here.
      - name: Build Catalyst-Runtime with transport enabled
        run: |
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_SRC_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_TRANSPORT=ON \
          make runtime

      - name: Verify the GPU coprocessor backend was built
        # conftest's gpu_transport_backend fixture skips when this .so is absent, which reads as
        # "tests passed". It is built only when CMake set TRANSPORT_HAS_HIP, so on a miss dump
        # what CMake actually resolved -- find_program/find_path cached their answers.
        run: |
          name=libcatalyst_transport_memcpy_gpu_coprocessor.so
          if find "$(pwd)/runtime-build/lib" -name "$name" | grep -q .; then
            find "$(pwd)/runtime-build/lib" -name "$name" -exec ls -l {} +
            exit 0
          fi
          echo "$name was not built. Why:"
          echo "--- what CMake resolved ---"
          grep -E "^(_nvcc|_hip_include_dir|CMAKE_HIP_PLATFORM|CMAKE_HIP_COMPILER|TRANSPORT_HIP_PACKAGES)" \
            "$(pwd)/runtime-build/CMakeCache.txt" || echo "(no HIP entries in the cache at all)"
          echo "--- nvcc on this host ---"
          command -v nvcc || echo "nvcc not on PATH"
          ls -l /usr/local/cuda/bin/nvcc 2>/dev/null || echo "no /usr/local/cuda/bin/nvcc"
          echo "--- fetched headers, if any ---"
          ls -d "$(pwd)/runtime-build/hip-headers/payload/opt/rocm-"* 2>/dev/null \
            || echo "(no fetched header tree: the fetch never ran)"
          exit 1

      - name: Build the memcpy test binary
        run: |
          cmake --build "$(pwd)/runtime-build" --target runner_tests_transport_memcpy -j

      - name: Run memcpy transport tests
        run: |
          "$(pwd)/runtime-build/tests/runner_tests_transport_memcpy"

      # No ROCm install needed: lib/transport/CMakeLists.txt fetches the HIP headers when none are
      # present and drives them with nvcc, so TRANSPORT_HAS_HIP is set and the coproc .so is built.

      # Built here rather than reused from check-catalyst.yaml: those caches come from GH-hosted
      # images and the cached mlir-tblgen hits a GLIBC mismatch on this runner.
      - name: Build LLVM, StableHLO and Enzyme
        uses: ./.github/actions/build-mlir-stack
        with:
          llvm-version: ${{ needs.constants.outputs.llvm_version }}
          stablehlo-version: ${{ needs.constants.outputs.stablehlo_version }}
          enzyme-version: ${{ needs.constants.outputs.enzyme_version }}

      - name: Install Python runtime requirements
        run: |
          python3 -m pip install -r requirements.txt

      - name: Set up Triton and its CUDA driver
        # css_bp_decoder codegens through Triton, which dlopens libcuda.so.1. That ships with the
        # driver, not the toolkit -- the toolkit's lib64/stubs copy links but cannot initialize a
        # device, which is the "0 active drivers" gpu_triton_platform skips on. Resolve the real
        # one and prove activation here, rather than let a silent skip surface at the guard.
        run: |
          set -euo pipefail
          # cu129 matches this host's driver; PyPI's default torch targets CUDA 13 and refuses a
          # 12.9 driver, leaving torch.cuda.is_available() false. It also pins triton to 3.5.1 --
          # 3.8+ emits PTX that ptxas rejects for the decoder kernels. Nothing imports torch; it
          # is here because triton <3.8 probes the driver through torch.cuda.is_available().
          pip install torch --index-url https://download.pytorch.org/whl/cu129

          # `|| true`: grep exits 1 on no match, which under pipefail would abort the step
          # before the diagnostic below can run.
          libcuda=$(ldconfig -p | awk '/libcuda\.so\.1/ {print $NF}' | grep -v /stubs/ | head -1 || true)
          if [ -z "$libcuda" ]; then
            libcuda=$(find /usr/lib /usr/lib64 -name 'libcuda.so.1' -not -path '*/stubs/*' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$libcuda" ]; then
            echo "No real libcuda.so.1 here -- only the toolkit stub, if that."
            nvidia-smi || echo "nvidia-smi unavailable"
            ldconfig -p | grep -i libcuda || echo "(no libcuda in the loader cache at all)"
            exit 1
          fi

          libcuda_dir=$(dirname "$libcuda")
          echo "libcuda: $libcuda"
          export TRITON_LIBCUDA_PATH="$libcuda_dir"
          export LD_LIBRARY_PATH="$libcuda_dir${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          echo "TRITON_LIBCUDA_PATH=$libcuda_dir" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV

          # driver.active raises on 0 or >1 drivers -- the same call conftest turns into a skip.
          python3 - <<'PY'
          import subprocess
          import triton
          from triton.backends.nvidia.compiler import get_ptxas
          from triton.runtime.driver import driver

          print("triton", triton.__version__, "| active driver:", driver.active)
          # Triton bundles its own ptxas, so its version is not implied by nvcc's. Best-effort:
          # this is context for a failure and must not become one.
          try:
              ptxas = get_ptxas(driver.active.get_current_target().arch).path
              print(subprocess.run([ptxas, "--version"], capture_output=True, text=True).stdout)
          except Exception as exc:  # noqa: BLE001 - diagnostic only
              print("could not resolve triton's bundled ptxas:", exc)
          PY

      - name: Build Catalyst frontend (reusing the transport-enabled runtime)
        run: |
          # precompile_decomposition_rules runs at the end of `make frontend` and needs both vars
          # set here, since the step that exports them for the rest of the job runs after this one.
          # Without CATALYST_LIB_DIR the default_pipelines import fails, precompilation is skipped
          # with only a warning, and rules are derived during tracing -- where a signature mismatch
          # against PennyLane's rule._impl aborts capture.
          export PYTHONPATH="${PYTHONPATH:-}:$(pwd)/quantum-build/python_packages/quantum"
          export CATALYST_LIB_DIR="$(pwd)/quantum-build/lib"
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          ENABLE_LLD=ON \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_BUILD_DIR="$(pwd)/llvm-build" \
          STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
          ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
          DIALECTS_BUILD_DIR="$(pwd)/quantum-build" \
          ENABLE_TRANSPORT=ON \
          make catalyst

      - name: Add Frontend Dependencies to PATH
        run: |
          echo "$(pwd)/llvm-build/bin" >> $GITHUB_PATH
          echo "$(pwd)/quantum-build/bin" >> $GITHUB_PATH
          echo "PYTHONPATH=${PYTHONPATH:-}:$(pwd)/quantum-build/python_packages/quantum" >> $GITHUB_ENV
          echo "RUNTIME_LIB_DIR=$(pwd)/runtime-build/lib" >> $GITHUB_ENV
          echo "MLIR_LIB_DIR=$(pwd)/llvm-build/lib" >> $GITHUB_ENV
          echo "CATALYST_BIN_DIR=$(pwd)/quantum-build/bin" >> $GITHUB_ENV
          echo "CATALYST_LIB_DIR=$(pwd)/quantum-build/lib" >> $GITHUB_ENV
          echo "CATALYST_TRANSPORT_PATH=$(pwd)/runtime-build/lib" >> $GITHUB_ENV

      - name: Run backline GPU integration tests
        id: gpu-tests
        env:
          # ptxas writes its diagnostics to a temp file Triton discards unless this is set, which
          # leaves a codegen failure looking like a bare "exit status 255".
          TRITON_DUMP_PTXAS_LOG: "1"
        # CPU-CPU memcpy is covered by check-catalyst.yaml; these three need the local GPU.
        # precompiled: gpu_steane_launcher. triton_css_bp: Triton codegen, compile-only.
        # manual_qec: encoded circuit + Triton-built decoder, executes ghz() on the GPU.
        # Two gates can skip them -- gpu_transport_backend (the coproc .so built above; without
        # the gate the executing cases raise out of _resolve_backend_lib) and gpu_triton_platform
        # (a GPU with an active Triton driver, the only gate able to skip everything).
        # -rs makes every skip visible in the log.
        run: |
          python3 -m pytest -v -rs --junit-xml=gpu-backline-results.xml \
            "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_cpu_controller_to_gpu_coproc_memcpy_precompiled" \
            "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_cpu_controller_to_gpu_coproc_triton_css_bp" \
            "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_cpu_controller_to_gpu_coproc_memcpy_manual_qec"

      - name: Require at least one GPU test to have executed
        # pytest exits 0 when every selected test is skipped, so without this the job reports
        # success covering nothing, after ~20 min of GPU time. A full skip means Triton found no
        # active driver, since the backend .so is built above. Guarded on the tests having run:
        # on an earlier failure there is no junit file, and failing here buries the real error.
        if: always() && steps.gpu-tests.outcome != 'skipped'
        run: |
          python3 - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("gpu-backline-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          print(f"{total - skipped}/{total} backline GPU tests executed ({skipped} skipped)")
          if total == 0 or skipped == total:
              sys.exit(
                  "No backline GPU test executed -- all selected tests were skipped. "
                  "Refusing to report success for a run with zero GPU coverage."
              )
          EOF

