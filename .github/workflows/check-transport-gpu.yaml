name: Check Transport Backends (GPU)

# Runs the runtime transport tests on a GPU host. To keep GPU runner time cheap, pull requests
# only trigger a run once labeled ``gpu``; ``push`` to main runs unconditionally.

on:
  push:
    branches: [ main ]
    paths:
      - 'runtime/lib/transport/**'
      - 'runtime/include/Transport*'
      - 'runtime/tests/Test_Transport*'
      - 'mlir/lib/Transport/**'
      - 'mlir/include/Transport/**'
      - 'frontend/catalyst/backline.py'
      - 'frontend/test/pytest/test_backline.py'
      - '.github/workflows/check-transport-gpu.yaml'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
    paths:
      - 'runtime/lib/transport/**'
      - 'runtime/include/Transport*'
      - 'runtime/tests/Test_Transport*'
      - 'mlir/lib/Transport/**'
      - 'mlir/include/Transport/**'
      - 'frontend/catalyst/backline.py'
      - 'frontend/test/pytest/test_backline.py'
      - '.github/workflows/check-transport-gpu.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constants:
    name: Set build matrix
    uses: ./.github/workflows/constants.yaml

  transport-tests-gpu:
    name: Transport Backend Tests (GPU)
    needs: [constants]
    runs-on:
      - single-gpu-x64

    # Push always runs; PRs need a non-draft open state and the ``gpu`` label.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'gpu')
        )
      }}

    steps:
      - name: Update PATH and LD_LIBRARY_PATH for CUDA
        run: |
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> $GITHUB_ENV

      - name: Checkout Catalyst repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.constants.outputs.primary_python_version }}

      - name: Install Python build dependencies
        run: |
          python3 -m pip install "cmake>=3.26" ninja "nanobind<2.13" pybind11 numpy PyYAML

      - name: Get Cached LLVM Source
        id: cache-llvm-source
        uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
          enableCrossOsArchive: true

      - name: Clone LLVM Submodule
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.constants.outputs.llvm_version }}
          path: mlir/llvm-project

      # The runtime configure + build only needs LLVM source headers (MLIR_INCLUDE_DIRS
      # -> mlir/llvm-project/mlir/include, header-only via rt_capi). No built-LLVM
      # artifacts are consumed as long as ENABLE_EXECUTOR stays OFF, which it does here.
      - name: Build Catalyst-Runtime with transport enabled
        run: |
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_TRANSPORT=ON \
          make runtime

      - name: Build the memcpy test binary
        run: |
          cmake --build "$(pwd)/runtime-build" --target runner_tests_transport_memcpy -j

      - name: Run memcpy transport tests
        run: |
          "$(pwd)/runtime-build/tests/runner_tests_transport_memcpy"

      # Cross-runner cache restore only works because mlir/Makefile now passes LLVM_DIR
      # explicitly to the dialects/stablehlo/plugin cmake invocations. Without it, MLIRConfig's
      # baked-in HINTS points at the runner where LLVM was configured and find_package(LLVM)
      # fails on any other runner.
      - name: Restore cached LLVM build
        uses: actions/cache/restore@v4
        with:
          path: llvm-build
          key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-gcc
          fail-on-cache-miss: true

      - name: Restore cached StableHLO source and build
        uses: actions/cache/restore@v4
        with:
          path: mlir/stablehlo
          key: stablehlo-${{ needs.constants.outputs.stablehlo_version }}-default-source
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: stablehlo-build
          key: ${{ runner.os }}-stablehlo-${{ needs.constants.outputs.stablehlo_version }}-ci-build-gcc
          fail-on-cache-miss: true

      - name: Restore cached Enzyme source and build
        uses: actions/cache/restore@v4
        with:
          path: mlir/Enzyme
          key: enzyme-${{ needs.constants.outputs.enzyme_version }}-default-source
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: enzyme-build
          key: ${{ runner.os }}-enzyme-${{ needs.constants.outputs.llvm_version }}-${{ needs.constants.outputs.enzyme_version }}-ci-build-gcc
          fail-on-cache-miss: true

      - name: Install self-hosted runner build dependencies
        # lld: HandleLLVMOptions.cmake probes -fuse-ld=lld when consuming LLVMConfig.
        # libxml2-dev: LLVMConfig.cmake calls find_package(LibXml2).
        run: |
          sudo apt-get update
          sudo apt-get install -y lld libxml2-dev

      - name: Rewrite absolute paths in cached CMake configs
        # LLVMConfig.cmake and its includes bake in absolute paths from wherever LLVM was
        # configured. check-catalyst.yaml runs on GH-hosted runners (/home/runner/work/...),
        # while this workflow runs on a self-hosted GPU runner (/opt/actions-runner/_work/...),
        # so those include() lines resolve to nonexistent files. Rewrite them in-place.
        run: |
          set -euo pipefail
          REAL_PWD="$(pwd)"
          for host_prefix in /home/runner/work/catalyst/catalyst; do
            if [ "$host_prefix" = "$REAL_PWD" ]; then continue; fi
            find llvm-build stablehlo-build enzyme-build mlir/stablehlo mlir/Enzyme \
              -name '*.cmake' -type f -print0 2>/dev/null \
              | xargs -0 --no-run-if-empty sed -i "s|${host_prefix}|${REAL_PWD}|g"
          done

      - name: Install Python runtime requirements
        run: |
          python3 -m pip install -r requirements.txt

      - name: Install latest PennyLane and Lightning
        run: |
          # Latest/latest/latest: Catalyst is built from this checkout; PennyLane and Lightning
          # come from their ``main`` branches so the frontend links against the same versions the
          # CPL_latest-latest-latest job exercises.
          pip install --no-deps --force pennylane-lightning
          pip install --no-deps --force pennyLane-lightning-kokkos
          pip install --no-deps --force git+https://github.com/PennyLaneAI/pennylane@main

      - name: Build Catalyst frontend (reusing the transport-enabled runtime)
        run: |
          # make catalyst -> make frontend invokes precompile_decomposition_rules, which imports
          # catalyst -> mlir_quantum. mlir_quantum lives under quantum-build/python_packages/quantum
          # once the dialects sub-target has run, so PYTHONPATH must include that dir before this
          # step's shell exits.
          export PYTHONPATH="${PYTHONPATH:-}:$(pwd)/quantum-build/python_packages/quantum"
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          ENABLE_LLD=ON \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_BUILD_DIR="$(pwd)/llvm-build" \
          STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
          ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
          DIALECTS_BUILD_DIR="$(pwd)/quantum-build" \
          ENABLE_TRANSPORT=ON \
          make catalyst

      - name: Add Frontend Dependencies to PATH
        run: |
          echo "$(pwd)/llvm-build/bin" >> $GITHUB_PATH
          echo "$(pwd)/quantum-build/bin" >> $GITHUB_PATH
          echo "PYTHONPATH=${PYTHONPATH:-}:$(pwd)/quantum-build/python_packages/quantum" >> $GITHUB_ENV
          echo "RUNTIME_LIB_DIR=$(pwd)/runtime-build/lib" >> $GITHUB_ENV
          echo "MLIR_LIB_DIR=$(pwd)/llvm-build/lib" >> $GITHUB_ENV
          echo "CATALYST_BIN_DIR=$(pwd)/quantum-build/bin" >> $GITHUB_ENV
          echo "CATALYST_LIB_DIR=$(pwd)/quantum-build/lib" >> $GITHUB_ENV
          echo "CATALYST_TRANSPORT_PATH=$(pwd)/runtime-build/lib" >> $GITHUB_ENV

      - name: Run backline memcpy integration tests
        # RDMA loopback cases stay in check-transport-cpu.yaml where soft-RoCE is set up;
        # this runner only exercises the memcpy path.
        run: |
          python3 -m pytest -v \
            frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration \
            -k memcpy

