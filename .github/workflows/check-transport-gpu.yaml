name: Check Transport Backends (GPU)

# Runs the runtime transport tests on a GPU host. To keep GPU runner time cheap, pull requests
# only trigger a run once labeled ``gpu``; ``push`` to main runs unconditionally.

on:
  push:
    branches: [ main ]
    paths:
      - 'runtime/lib/transport/**'
      - 'runtime/include/Transport*'
      - 'runtime/tests/Test_Transport*'
      - 'mlir/lib/Transport/**'
      - 'mlir/include/Transport/**'
      - 'frontend/catalyst/backline.py'
      - 'frontend/test/pytest/test_backline.py'
      - '.github/workflows/check-transport-gpu.yaml'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
    paths:
      - 'runtime/lib/transport/**'
      - 'runtime/include/Transport*'
      - 'runtime/tests/Test_Transport*'
      - 'mlir/lib/Transport/**'
      - 'mlir/include/Transport/**'
      - 'frontend/catalyst/backline.py'
      - 'frontend/test/pytest/test_backline.py'
      - '.github/workflows/check-transport-gpu.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constants:
    name: Set build matrix
    uses: ./.github/workflows/constants.yaml

  transport-tests-gpu:
    name: Transport Backend Tests (GPU)
    needs: [constants]
    runs-on:
      - single-gpu-x64

    # Push always runs; PRs need a non-draft open state and the ``gpu`` label.
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          contains(github.event.pull_request.labels.*.name, 'gpu')
        )
      }}

    steps:
      - name: Update PATH and LD_LIBRARY_PATH for CUDA
        run: |
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> $GITHUB_ENV

      - name: Checkout Catalyst repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.constants.outputs.primary_python_version }}

      - name: Install Python build dependencies
        run: |
          python3 -m pip install "cmake>=3.26" ninja "nanobind<2.13" pybind11 numpy PyYAML

      - name: Install RDMA userland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libibverbs-dev libibverbs1 ibverbs-providers ibverbs-utils \
            rdma-core iproute2

      - name: Ensure rdma_rxe.ko is available for the running kernel
        run: |
          # Try linux-modules-extra first; if the .ko isn't there, build
          # rdma_rxe out-of-tree from the matching upstream stable branch.
          set -euo pipefail

          KVER=$(uname -r)
          echo "Running kernel: $KVER"

          have_rxe() {
            find /lib/modules/"$KVER" -name 'rdma_rxe*' -print -quit | grep -q .
          }

          # --- Path 1: standard Ubuntu extras package ----------------------
          sudo apt-get install -y "linux-modules-extra-$KVER" 2>/dev/null || true
          sudo depmod -a
          if have_rxe; then
            echo "rdma_rxe.ko provided by linux-modules-extra-$KVER"
            find /lib/modules/"$KVER" -name 'rdma_rxe*' -print
            exit 0
          fi

          echo "linux-modules-extra unavailable or missing rdma_rxe;" \
               "falling back to out-of-tree build."

          # --- Path 2: build rdma_rxe out-of-tree --------------------------
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev git \
            "linux-headers-$KVER"

          # Upstream stable branch matching the running kernel's major.minor.
          KVER_MAJMIN=$(echo "$KVER" | cut -d- -f1 | cut -d. -f1-2)
          SRC=/tmp/linux-src
          echo "Cloning linux-${KVER_MAJMIN}.y stable branch..."
          git clone --depth 1 \
            --branch "linux-${KVER_MAJMIN}.y" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "$SRC"

          # Force obj-m; Azure kernel has CONFIG_RDMA_RXE unset.
          sed -i 's|obj-\$(CONFIG_RDMA_RXE)|obj-m|' \
            "$SRC/drivers/infiniband/sw/rxe/Makefile"

          make -C "/lib/modules/$KVER/build" \
            M="$SRC/drivers/infiniband/sw/rxe" modules

          KO="$SRC/drivers/infiniband/sw/rxe/rdma_rxe.ko"
          if [ ! -f "$KO" ]; then
            echo "::error::rdma_rxe.ko not produced by build"
            ls -la "$SRC/drivers/infiniband/sw/rxe/"
            exit 1
          fi

          sudo install -D -m 644 "$KO" \
            "/lib/modules/$KVER/kernel/drivers/infiniband/sw/rxe/rdma_rxe.ko"
          sudo depmod -a

          if ! have_rxe; then
            echo "::error::rdma_rxe.ko not resolvable after install"
            exit 1
          fi
          echo "Built and installed rdma_rxe.ko from linux-${KVER_MAJMIN}.y"
          modinfo rdma_rxe | head -20

      - name: Configure Soft-RoCE (rxe0 on loopback)
        run: |
          # Attach rdma_rxe to `lo` so the tests find an ibverbs device named rxe0.
          sudo modprobe rdma_rxe
          sudo rdma link add rxe0 type rxe netdev lo
          rdma link show
          ibv_devices
          ibv_devinfo -d rxe0
          # Fail fast if rxe0 didn't come up - otherwise Catch2 tests would
          # silently SKIP and the loopback would be the only thing exercising it.
          ibv_devices | awk '{print $1}' | grep -q '^rxe0$'

      - name: Get Cached LLVM Source
        id: cache-llvm-source
        uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
          enableCrossOsArchive: true

      - name: Clone LLVM Submodule
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.constants.outputs.llvm_version }}
          path: mlir/llvm-project

      # The runtime configure + build only needs LLVM source headers (MLIR_INCLUDE_DIRS
      # -> mlir/llvm-project/mlir/include, header-only via rt_capi). No built-LLVM
      # artifacts are consumed as long as ENABLE_EXECUTOR stays OFF, which it does here.
      - name: Build Catalyst-Runtime with transport enabled
        run: |
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_TRANSPORT=ON \
          make runtime

      - name: Build the memcpy test binary
        run: |
          cmake --build "$(pwd)/runtime-build" --target runner_tests_transport_memcpy -j

      - name: Run memcpy transport tests
        run: |
          "$(pwd)/runtime-build/tests/runner_tests_transport_memcpy"

      # TODO: run frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration here.
      # It needs the LLVM + quantum-dialect build; restoring the check-catalyst.yaml caches from
      # this self-hosted GPU runner produces MLIRConfig.cmake without a resolvable LLVMConfig
      # (see run 32523225599). Until the caches work across hosted/self-hosted runners, the Python
      # integration tests only run in workflows on GH-hosted runners.

