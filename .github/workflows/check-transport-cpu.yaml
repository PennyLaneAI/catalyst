name: Check Transport Backends (CPU)

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - 'runtime/lib/transport/**'
      - 'runtime/tests/Test_Transport*.cpp'
      - 'runtime/tests/stubs/stub_transport_backend*'
      - 'runtime/tests/CMakeLists.txt'
      - 'runtime/CMakeLists.txt'
      - 'runtime/lib/CMakeLists.txt'
      - 'runtime/Makefile'
      - 'Makefile'
      - '.github/workflows/check-transport-cpu.yaml'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine_runner:
    if: github.event.pull_request.draft == false
    name: Determine runner type to use
    uses: ./.github/workflows/determine-workflow-runner.yml
    with:
      default_runner: ubuntu-24.04

  constants:
    name: "Set build matrix"
    uses: ./.github/workflows/constants.yaml
    needs: [determine_runner]
    with:
      multiple_compilers: false
      runs_on: ${{ needs.determine_runner.outputs.runner_group }}

  transport-tests:
    name: Transport Backend Tests (Soft-RoCE)
    needs: [constants, determine_runner]
    runs-on: ${{ needs.determine_runner.outputs.runner_group }}

    steps:
      - name: Checkout Catalyst repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.constants.outputs.primary_python_version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # lld is required at dialects-configure time: the cached LLVM was built with
          # LLVM_ENABLE_LLD=ON, and HandleLLVMOptions.cmake probes the host toolchain for
          # -fuse-ld=lld when the dialects project includes LLVMConfig.
          sudo apt-get install -y cmake ninja-build make lld
          python3 -m pip install "nanobind<2.13" pybind11

      - name: Set up Soft-RoCE loopback
        uses: ./.github/actions/setup-soft-roce

      - name: Get Cached LLVM Source
        id: cache-llvm-source
        uses: actions/cache/restore@v4
        with:
          path: mlir/llvm-project
          key: llvm-${{ needs.constants.outputs.llvm_version }}-default-source
          enableCrossOsArchive: true

      - name: Clone LLVM Submodule
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ needs.constants.outputs.llvm_version }}
          path: mlir/llvm-project

      - name: Build Catalyst-Runtime with ENABLE_TRANSPORT=ON
        run: |
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          LLVM_DIR="$(pwd)/mlir/llvm-project" \
          ENABLE_ASAN=OFF \
          ENABLE_TRANSPORT=ON \
          make runtime

      - name: Run transport test suite (Catch2 + loopback)
        run: |
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          LLVM_DIR="$(pwd)/mlir/llvm-project" \
          make test-runtime-transport

      # Cross-workflow cache restore relies on mlir/Makefile passing LLVM_DIR explicitly to the
      # dialects/stablehlo/plugin cmake invocations. Without it, MLIRConfig's baked-in HINTS
      # references the absolute path from wherever LLVM was configured and find_package(LLVM)
      # fails when llvm-build/ was populated by check-catalyst.yaml on a different runner.
      - name: Restore cached LLVM build
        uses: actions/cache/restore@v4
        with:
          path: llvm-build
          key: ${{ runner.os }}-llvm-${{ needs.constants.outputs.llvm_version }}-ci-build-gcc
          fail-on-cache-miss: true

      - name: Restore cached StableHLO source and build
        uses: actions/cache/restore@v4
        with:
          path: mlir/stablehlo
          key: stablehlo-${{ needs.constants.outputs.stablehlo_version }}-default-source
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: stablehlo-build
          key: ${{ runner.os }}-stablehlo-${{ needs.constants.outputs.stablehlo_version }}-ci-build-gcc
          fail-on-cache-miss: true

      - name: Restore cached Enzyme source and build
        uses: actions/cache/restore@v4
        with:
          path: mlir/Enzyme
          key: enzyme-${{ needs.constants.outputs.enzyme_version }}-default-source
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: enzyme-build
          key: ${{ runner.os }}-enzyme-${{ needs.constants.outputs.llvm_version }}-${{ needs.constants.outputs.enzyme_version }}-ci-build-gcc
          fail-on-cache-miss: true

      - name: Install Python runtime requirements
        run: |
          python3 -m pip install -r requirements.txt

      - name: Install latest PennyLane and Lightning
        run: |
          pip install --no-deps --force pennylane-lightning
          pip install --no-deps --force pennyLane-lightning-kokkos
          pip install --no-deps --force git+https://github.com/PennyLaneAI/pennylane@main

      - name: Build Catalyst frontend (reusing the transport-enabled runtime)
        run: |
          # make catalyst -> make frontend invokes precompile_decomposition_rules, which imports
          # catalyst -> mlir_quantum. mlir_quantum lives under quantum-build/python_packages/quantum
          # once the dialects sub-target has run, so PYTHONPATH must include that dir before this
          # step's shell exits.
          export PYTHONPATH="${PYTHONPATH:-}:$(pwd)/quantum-build/python_packages/quantum"
          COMPILER_LAUNCHER="" \
          C_COMPILER=$(which gcc) \
          CXX_COMPILER=$(which g++) \
          RT_BUILD_DIR="$(pwd)/runtime-build" \
          LLVM_BUILD_DIR="$(pwd)/llvm-build" \
          STABLEHLO_BUILD_DIR="$(pwd)/stablehlo-build" \
          ENZYME_BUILD_DIR="$(pwd)/enzyme-build" \
          DIALECTS_BUILD_DIR="$(pwd)/quantum-build" \
          ENABLE_TRANSPORT=ON \
          make catalyst

      - name: Add Frontend Dependencies to PATH
        run: |
          echo "$(pwd)/llvm-build/bin" >> $GITHUB_PATH
          echo "$(pwd)/quantum-build/bin" >> $GITHUB_PATH
          echo "PYTHONPATH=${PYTHONPATH:-}:$(pwd)/quantum-build/python_packages/quantum" >> $GITHUB_ENV
          echo "RUNTIME_LIB_DIR=$(pwd)/runtime-build/lib" >> $GITHUB_ENV
          echo "MLIR_LIB_DIR=$(pwd)/llvm-build/lib" >> $GITHUB_ENV
          echo "CATALYST_BIN_DIR=$(pwd)/quantum-build/bin" >> $GITHUB_ENV
          echo "CATALYST_LIB_DIR=$(pwd)/quantum-build/lib" >> $GITHUB_ENV
          echo "CATALYST_TRANSPORT_PATH=$(pwd)/runtime-build/lib" >> $GITHUB_ENV

      - name: Run backline cpu-cpu integration tests
        # Covers memcpy (2.a) and rdma_loopback (2.c) parametrize cases; excludes
        # test_cpu_controller_to_gpu_coproc_memcpy_manual_qec, which needs the GPU coproc lib.
        run: |
          python3 -m pytest -v \
            "frontend/test/pytest/test_backline.py::TestBacklineDemoIntegration::test_local_cpu_to_local_cpu"

      - name: Upload loopback logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transport-loopback-logs
          path: |
            /tmp/cvl_coproc.log
            /tmp/cvl_ctrl.log
          if-no-files-found: ignore
          retention-days: 7
